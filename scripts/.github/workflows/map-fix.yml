name: map-fix
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: guard
        run: |
          if grep -q "function fixMapSize" app.js; then
            echo "already patched"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: patch
        if: env.SKIP != '1'
        run: node scripts/apply-map-fix.js app.js app.patched.js

      - name: swap
        if: env.SKIP != '1'
        run: mv app.patched.js app.js

      - name: commit
        if: env.SKIP != '1'
        run: |
          git config user.name "map-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js
          git commit -m "fix(map): robust sizing, CARTO tiles, dialog toggle" || exit 0
          git push
